image:
  # Required at install time, e.g. <acr>.azurecr.io/eugo-docint
  repository: ""
  # Empty means .Chart.AppVersion
  tag: ""
  pullPolicy: IfNotPresent

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  # CPU alone never fires on the dominant path: PDF/DOCX/PPTX/HTML/image work is an Azure round
  # trip, so the pod blocks on I/O while memory climbs. Kept anyway -- XLSX runs through the
  # synchronous SpreadsheetEngine and is the one CPU-bound path. autoscaling/v2 takes the max of
  # the two recommendations.
  targetCPUUtilizationPercentage: 70
  # Absolute, not a percentage: Utilization measures against requests.memory (512Mi), which is a
  # scheduling hint rather than the real ceiling, so a pod holding 900Mi would read as 176% and peg
  # the HPA at maxReplicas immediately. 900Mi is baseline (~200Mi) plus about two thirds of the
  # 1 GiB admission budget, so it fires before saturation with headroom under the 2Gi limit.
  # It is a considered starting value, not a derived one -- see the design spec §7/§8 -- and empty
  # omits the memory metric entirely, which is the documented back-out.
  targetMemoryAverageValue: 900Mi
  # Memory is sticky: the pod runs Server GC with no CPU limit, so heaps follow the node's core
  # count and the working set decays slowly after a burst. This keeps the HPA from holding a high
  # replica count on a reading that is already stale. Empty omits the behavior block.
  scaleDownStabilizationSeconds: 600
# Used only when autoscaling.enabled is false
replicaCount: 2

serviceAccount:
  create: true
  # Empty means the chart fullname
  name: ""
  # When set: azure.workload.identity/client-id annotation on the ServiceAccount
  # and azure.workload.identity/use: "true" label on pods
  azureClientId: ""

azure:
  documentIntelligence:
    # Sets env DocumentIntelligence__Endpoint; empty omits the var and the
    # service answers engine_unconfigured per file (designed degraded mode)
    endpoint: ""
  openAI:
    # Sets env AzureOpenAI__Endpoint, e.g. https://<resource>.openai.azure.com/ — the resource
    # root only; the SDK appends /openai/deployments/<name>/chat/completions. Empty omits the
    # var and image files answer engine_unconfigured (designed degraded mode)
    endpoint: ""
    # Sets env AzureOpenAI__DeploymentNameVision; empty here omits the var and the image's
    # appsettings.json supplies model-eugo-docint-vision (a deployment alias, not a model
    # name). A name is required once openAI.endpoint is set,
    # so blanking it explicitly (via extraEnv) fails validation at pod start rather than
    # failing every image request.
    deploymentNameVision: ""

# Service limits. Each empty value omits its DocInt__* env var, leaving the image's
# appsettings.json default in force — the numbers are deliberately not repeated here, so
# there is nothing to drift. Set one to override it for this release. Only an empty value means
# "unset": a 0 or a negative is passed through to the pod and fails validation at startup rather
# than silently falling back to the default. A 0 here never means "no limit".
docint:
  # Per-file size cap, in bytes; a larger file gets a per-file too_large error inside a 200
  maxFileBytes: ""
  # Files accepted per request; more than this is a request-level 400
  maxFilesPerRequest: ""
  # Per-file engine timeout, in seconds
  perFileTimeoutSeconds: ""
  # Files processed concurrently within one request -- raise with the memory limit, not alone
  maxParallelism: ""
  # Cap on the SUM of file bytes in one request; over it is a request-level 400. Also sets what
  # Kestrel accepts (this + 1 MiB), so lowering it lowers the pod's worst-case buffered payload.
  maxRequestFileBytes: ""
  # The per-pod ceiling on bytes held in flight, and what happens when it fills. budgetBytes must
  # be at least maxRequestFileBytes + 1 MiB or the pod fails to boot -- deliberately, since a
  # budget under the largest admissible request could never serve it.
  admission:
    # false admits every request immediately; the request-level limits above still apply
    enabled: ""
    budgetBytes: ""
    queueTimeoutSeconds: ""
    retryAfterSeconds: ""

# Telemetry export. Empty endpoint omits all three vars below, which is the shipped behaviour:
# traces and metrics are collected in-process and go nowhere. Set it to an OTLP collector to
# ship them. The counters on /v1/extract are unreadable outside the pod without this.
otel:
  # Sets OTEL_EXPORTER_OTLP_ENDPOINT, e.g. http://otel-collector.observability:4317
  endpoint: ""
  # Sets OTEL_EXPORTER_OTLP_PROTOCOL. The .NET exporter defaults to grpc; many collectors accept
  # only http/protobuf, so this is first-class rather than left to extraEnv.
  protocol: ""

# Verbatim extra env entries, for keys with no first-class value above, e.g.:
# - name: Serilog__MinimumLevel__Default
#   value: "Debug"
# Appended after the entries above — don't also set a key here that has its own value.
extraEnv: []

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  # No CPU limit: throttling hurts latency more than it helps.
  # Memory is sized for the admission budget, which is the only thing bounding it: peak is
  # roughly baseline + DocInt:Admission:BudgetBytes (1 GiB shipped), because the reader holds
  # every accepted file's bytes for the whole request. An earlier version of this comment said
  # "<=50 MB/file, 4 in flight" -- that 4 is MaxParallelism, which is per request, and requests
  # themselves were unbounded, so the real peak was bytes-per-request x concurrent-requests.
  limits:
    memory: 2Gi

service:
  port: 8090
