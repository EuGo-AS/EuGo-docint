image:
  # Required at install time, e.g. <acr>.azurecr.io/eugo-docint
  repository: ""
  # Empty means .Chart.AppVersion
  tag: ""
  pullPolicy: IfNotPresent

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
# Used only when autoscaling.enabled is false
replicaCount: 2

serviceAccount:
  create: true
  # Empty means the chart fullname
  name: ""
  # When set: azure.workload.identity/client-id annotation on the ServiceAccount
  # and azure.workload.identity/use: "true" label on pods
  azureClientId: ""

azure:
  documentIntelligence:
    # Sets env DocumentIntelligence__Endpoint; empty omits the var and the
    # service answers engine_unconfigured per file (designed degraded mode)
    endpoint: ""
  openAI:
    # Sets env AzureOpenAI__Endpoint, e.g. https://<resource>.openai.azure.com/ — the resource
    # root only; the SDK appends /openai/deployments/<name>/chat/completions. Empty omits the
    # var and image files answer engine_unconfigured (designed degraded mode)
    endpoint: ""
    # Sets env AzureOpenAI__DeploymentNameVision; empty here omits the var and the image's
    # appsettings.json supplies model-eugo-docint-vision (a deployment alias, not a model
    # name). A name is required once openAI.endpoint is set,
    # so blanking it explicitly (via extraEnv) fails validation at pod start rather than
    # failing every image request.
    deploymentNameVision: ""

# Service limits. Each empty value omits its DocInt__* env var, leaving the image's
# appsettings.json default in force — the numbers are deliberately not repeated here, so
# there is nothing to drift. Set one to override it for this release. Only an empty value means
# "unset": a 0 or a negative is passed through to the pod and fails validation at startup rather
# than silently falling back to the default. A 0 here never means "no limit".
docint:
  # Per-file size cap, in bytes; a larger file gets a per-file too_large error inside a 200
  maxFileBytes: ""
  # Files accepted per request; more than this is a request-level 400
  maxFilesPerRequest: ""
  # Per-file engine timeout, in seconds
  perFileTimeoutSeconds: ""
  # Files processed concurrently — raise with the memory limit, not alone
  maxParallelism: ""

# Verbatim extra env entries, for keys with no first-class value above, e.g.:
# - name: Serilog__MinimumLevel__Default
#   value: "Debug"
# Appended after the entries above — don't also set a key here that has its own value.
extraEnv: []

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  # No CPU limit: throttling hurts latency more than it helps.
  # Memory is generous on purpose: files are buffered fully in memory
  # (<=50 MB/file, 4 in flight by default).
  limits:
    memory: 2Gi

service:
  port: 8090
