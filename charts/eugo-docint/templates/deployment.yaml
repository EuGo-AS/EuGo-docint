apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "eugo-docint.fullname" . }}
  labels:
    {{- include "eugo-docint.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "eugo-docint.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "eugo-docint.selectorLabels" . | nindent 8 }}
        {{- if .Values.serviceAccount.azureClientId }}
        azure.workload.identity/use: "true"
        {{- end }}
    spec:
      serviceAccountName: {{ include "eugo-docint.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: docint
          image: "{{ required "image.repository is required" .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8090
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /alive
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            failureThreshold: 3
          {{- $env := list }}
          {{- with .Values.azure.documentIntelligence.endpoint }}
          {{- $env = append $env (dict "name" "DocumentIntelligence__Endpoint" "value" .) }}
          {{- end }}
          {{- with .Values.azure.openAI.endpoint }}
          {{- $env = append $env (dict "name" "AzureOpenAI__Endpoint" "value" .) }}
          {{- end }}
          {{- with .Values.azure.openAI.deploymentNameVision }}
          {{- $env = append $env (dict "name" "AzureOpenAI__DeploymentNameVision" "value" .) }}
          {{- end }}
          {{- with .Values.docint.maxFileBytes }}
          {{- $env = append $env (dict "name" "DocInt__MaxFileBytes" "value" (printf "%d" (int64 .))) }}
          {{- end }}
          {{- with .Values.docint.maxFilesPerRequest }}
          {{- $env = append $env (dict "name" "DocInt__MaxFilesPerRequest" "value" (printf "%d" (int64 .))) }}
          {{- end }}
          {{- with .Values.docint.perFileTimeoutSeconds }}
          {{- $env = append $env (dict "name" "DocInt__PerFileTimeoutSeconds" "value" (printf "%d" (int64 .))) }}
          {{- end }}
          {{- with .Values.docint.maxParallelism }}
          {{- $env = append $env (dict "name" "DocInt__MaxParallelism" "value" (printf "%d" (int64 .))) }}
          {{- end }}
          {{- $env = concat $env .Values.extraEnv }}
          {{- with $env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
