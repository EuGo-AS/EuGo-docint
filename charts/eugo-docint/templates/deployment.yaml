apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "eugo-docint.fullname" . }}
  labels:
    {{- include "eugo-docint.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "eugo-docint.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "eugo-docint.selectorLabels" . | nindent 8 }}
        {{- if .Values.serviceAccount.azureClientId }}
        azure.workload.identity/use: "true"
        {{- end }}
    spec:
      serviceAccountName: {{ include "eugo-docint.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: docint
          image: "{{ required "image.repository is required" .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8090
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /alive
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            failureThreshold: 3
          {{- $env := list }}
          {{- with .Values.azure.documentIntelligence.endpoint }}
          {{- $env = append $env (dict "name" "DocumentIntelligence__Endpoint" "value" .) }}
          {{- end }}
          {{- with .Values.azure.openAI.endpoint }}
          {{- $env = append $env (dict "name" "AzureOpenAI__Endpoint" "value" .) }}
          {{- end }}
          {{- with .Values.azure.openAI.deploymentNameVision }}
          {{- $env = append $env (dict "name" "AzureOpenAI__DeploymentNameVision" "value" .) }}
          {{- end }}
          {{- /* Deliberately not `with`, which the Azure endpoints above can safely use: `with`
                 treats 0 as empty, so `--set docint.maxFileBytes=0` would omit the var and leave
                 the image's default silently in force -- the opposite of the fail-fast contract
                 in the chart design spec S4. Only nil and "" mean "unset" here; 0 and negatives
                 are emitted so DocIntOptions' ValidateOnStart rejects them at pod start. The is-set
                 test lives once, over all four, so it cannot be fixed for one limit and not the
                 rest. The nil guard is a separate outer `if` on purpose: sprig's int64 coerces nil
                 to 0, so `--set docint.maxFileBytes=null` would otherwise render a 0 nobody asked
                 for. int64 (rather than the bare value) because a plain YAML number reaches Helm
                 as a float64 and would emit 5.24288e+07. */}}
          {{- $limits := dict
                "MaxFileBytes" .Values.docint.maxFileBytes
                "MaxFilesPerRequest" .Values.docint.maxFilesPerRequest
                "PerFileTimeoutSeconds" .Values.docint.perFileTimeoutSeconds
                "MaxParallelism" .Values.docint.maxParallelism }}
          {{- range $name, $value := $limits }}
          {{- if not (kindIs "invalid" $value) }}
          {{- if ne (toString $value) "" }}
          {{- $env = append $env (dict "name" (printf "DocInt__%s" $name) "value" (printf "%d" (int64 $value))) }}
          {{- end }}
          {{- end }}
          {{- end }}
          {{- $env = concat $env .Values.extraEnv }}
          {{- with $env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # readOnlyRootFilesystem above leaves the container with nowhere to write, but the
        # SpreadsheetEngine's OpenXML reader spills package parts to /tmp even though it opens
        # from a MemoryStream -- without this, every XLSX request fails with
        # engine_error "Read-only file system : '/tmp/'". Deliberately disk-backed: a
        # medium: Memory emptyDir counts against the container memory limit, which is already
        # sized for MaxFileBytes x MaxParallelism buffered in memory.
        - name: tmp
          emptyDir: {}
