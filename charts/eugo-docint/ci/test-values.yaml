image:
  repository: creugoexample.azurecr.io/eugo-docint
  tag: 0.1.0
serviceAccount:
  azureClientId: 00000000-0000-0000-0000-000000000000
azure:
  documentIntelligence:
    endpoint: https://example-di.cognitiveservices.azure.com/
  openAI:
    endpoint: https://example-aoai.openai.azure.com/
    deploymentNameVision: model-eugo-docint-vision
# A bare number here proves the template stringifies it — k8s rejects a non-string env value.
docint:
  maxFileBytes: 10485760
  maxParallelism: 2
# Kept on a key with no first-class value, so the verbatim path stays covered too.
extraEnv:
  - name: Serilog__MinimumLevel__Default
    value: "Debug"
