name: ci

# paths-ignore is workflow-level, so a docs-only commit skips ALL jobs, not just the
# image build. A commit touching docs AND code still runs everything -- it only skips
# when every changed file matches. Caveat: main has no branch protection today; if `ci`
# is ever made a required status check, docs-only PRs would hang unreported.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']

# Supersede an in-flight run for the same ref instead of building that ref twice.
# PR refs (refs/pull/N/merge) and main hash to different groups, so a PR never cancels
# main -- but two pushes to main in quick succession do cancel the older run, which then
# reports "cancelled" instead of a pass/fail for that commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The action majors below are the node24 ones (node20 is deprecated). They require Actions
# Runner >= v2.327.1 -- given on ubuntu-latest, a constraint only if this moves to self-hosted.
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore src/DocInt.slnx
      - run: dotnet build --no-restore src/DocInt.slnx
      - run: dotnet test --no-build src/DocInt.slnx

  docker:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      # amd64 only here: CI's job is to prove the Dockerfile still builds, and the SDK
      # stage is cross-compiled (--platform=$BUILDPLATFORM + -a $TARGETARCH), so a
      # second target arch re-runs restore/publish for very little extra signal. The
      # arm64 leg is validated where it ships -- release.yml keeps linux/amd64,arm64.
      # setup-qemu above is dead weight while this is single-arch; kept deliberately so
      # re-adding a platform here is a one-line change.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          tags: eugo-docint:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Lint and render only -- no `helm package`, no `helm push`. Nothing is published from ci.yml;
  # the chart is packaged and pushed solely by release.yml on a v* / chart-v* tag.
  chart-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - run: helm lint charts/eugo-docint
      - run: helm template ci charts/eugo-docint -f charts/eugo-docint/ci/test-values.yaml > /dev/null
      - run: helm template ci charts/eugo-docint --set image.repository=r.example/eugo-docint --set autoscaling.enabled=false > /dev/null
      # Regression gate for the read-only-root/XLSX bug: the pod runs with
      # readOnlyRootFilesystem, but OpenXML spills package parts to /tmp, so every XLSX
      # request fails with engine_error unless a writable volume is mounted there. Rendered
      # from the minimal values on purpose -- the mount must not depend on any value being
      # set. Both halves are asserted: a volumeMount whose volume is missing renders fine
      # and only fails at apply time.
      # Rendered to a file rather than `helm template | tee f | grep -q`: grep -q exits on its
      # first match and can SIGPIPE tee mid-write, and volumeMounts renders before volumes,
      # so the emptyDir line is exactly the part that could be lost.
      - name: rendered pod mounts a writable /tmp
        run: |
          helm template ci charts/eugo-docint --set image.repository=r.example/eugo-docint > rendered.yaml
          grep -q 'mountPath: /tmp' rendered.yaml
          grep -q 'emptyDir' rendered.yaml
      # A 0 must reach the pod, not be swallowed. Helm's `with` treats 0 as empty, so the limits
      # render through an explicit is-set test instead -- without it `--set docint.maxFileBytes=0`
      # leaves the image's default silently in force, the opposite of the fail-fast contract in
      # the design spec §4 (and DocIntOptions rejects 0 at startup, per OptionsTests
      # .Zero_limit_fails_host_startup). Two of the four limits are asserted, not one: the is-set
      # test is shared, so a regression that restored `with` for only some of them must not pass.
      # The unset case is the other half of the contract -- the chart still restates no numbers.
      # Intermediate files rather than `grep | grep -q`, same reason as the step above.
      - name: zero limits reach the pod, unset limits do not
        run: |
          render() { helm template ci charts/eugo-docint --set image.repository=r.example/eugo-docint "$@"; }
          render --set docint.maxFileBytes=0 > zero-bytes.yaml
          grep -A1 'DocInt__MaxFileBytes' zero-bytes.yaml > matched-bytes.txt
          grep -q 'value: "0"' matched-bytes.txt
          render --set docint.maxParallelism=0 > zero-parallelism.yaml
          grep -A1 'DocInt__MaxParallelism' zero-parallelism.yaml > matched-parallelism.txt
          grep -q 'value: "0"' matched-parallelism.txt
          render > default.yaml
          # `set -e` does not fire on a negated command, so a bare `! grep` asserts nothing
          # unless it happens to be its step's last line -- the step's exit status then comes
          # from whatever runs after it. Explicit `if` at every negated site instead, so
          # appending a line to any of these steps cannot silently disable the assertion.
          if grep -q 'DocInt__' default.yaml; then
            echo "a DocInt__ var rendered with every limit unset"; exit 1
          fi
      # The counters added in this release are invisible without an OTLP endpoint, so the chart
      # has to be able to set one. Both halves are asserted: set renders all three vars (the
      # service name is derived, not user-supplied, and without it every namespace reports as
      # DocInt.Api), and unset renders none of them -- a release that configures no collector
      # must behave exactly as it did before.
      - name: otel env renders only when an endpoint is set
        run: |
          render() { helm template ci charts/eugo-docint --set image.repository=r.example/eugo-docint "$@"; }
          render --set otel.endpoint=http://collector:4317 --set otel.protocol=grpc > otel-on.yaml
          grep -q 'OTEL_EXPORTER_OTLP_ENDPOINT' otel-on.yaml
          grep -q 'OTEL_EXPORTER_OTLP_PROTOCOL' otel-on.yaml
          grep -q 'OTEL_SERVICE_NAME' otel-on.yaml
          render > otel-off.yaml
          # Explicit `if`, not `! grep` -- see the note in the zero-limits step above.
          if grep -q 'OTEL_' otel-off.yaml; then
            echo "an OTEL_ var rendered with no endpoint configured"; exit 1
          fi
      # The CPU metric alone never fires on the Azure-bound path -- the pod is blocked on I/O while
      # memory climbs -- so scale-out has to key on memory too. Both halves are asserted: the metric
      # renders with the configured value, and blanking it removes only the memory metric, which is
      # the documented back-out if GC retention pins the replica count.
      - name: hpa keys on memory as well as cpu
        run: |
          render() { helm template ci charts/eugo-docint --set image.repository=r.example/eugo-docint "$@"; }
          render > hpa-on.yaml
          grep -q 'averageValue: 900Mi' hpa-on.yaml
          grep -q 'stabilizationWindowSeconds: 600' hpa-on.yaml
          render --set autoscaling.targetMemoryAverageValue="" > hpa-off.yaml
          # Explicit `if`, not `! grep` -- see the note in the zero-limits step above.
          if grep -q 'averageValue' hpa-off.yaml; then
            echo "memory metric still rendered after blanking targetMemoryAverageValue"; exit 1
          fi
          grep -q 'averageUtilization: 70' hpa-off.yaml
      # Same omit-when-empty contract as the other DocInt limits: 0 and false must reach the pod and
      # fail ValidateOnStart, only an empty value means "unset". Two of the five are asserted because
      # the is-set test is shared -- and `enabled` separately, because Helm's `with` treats false as
      # empty exactly as it treats 0.
      - name: admission limits reach the pod, unset ones do not
        run: |
          render() { helm template ci charts/eugo-docint --set image.repository=r.example/eugo-docint "$@"; }
          render --set docint.admission.budgetBytes=0 > adm-zero.yaml
          grep -A1 'DocInt__Admission__BudgetBytes' adm-zero.yaml > adm-matched.txt
          grep -q 'value: "0"' adm-matched.txt
          render --set docint.admission.enabled=false > adm-false.yaml
          grep -A1 'DocInt__Admission__Enabled' adm-false.yaml > adm-enabled.txt
          grep -q 'value: "false"' adm-enabled.txt
          render --set docint.maxRequestFileBytes=0 > adm-total.yaml
          grep -A1 'DocInt__MaxRequestFileBytes' adm-total.yaml > adm-total-matched.txt
          grep -q 'value: "0"' adm-total-matched.txt
          render > adm-default.yaml
          if grep -q 'DocInt__' adm-default.yaml; then
            echo "a DocInt__ var rendered with every admission value unset"; exit 1
          fi
